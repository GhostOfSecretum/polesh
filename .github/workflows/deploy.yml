name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload site to hosting
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: server173.hosting.reg.ru
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: ./
          timeout: 120000
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/scripts/**
            **/images/**
            **/videos/**
            portrait_background_reference.png
            **/*.mp4
            **/.DS_Store

      - name: Upload missing images and videos
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp
          lftp -u "$FTP_USERNAME" ftp://server173.hosting.reg.ru <<'EOF'
          set cmd:fail-exit yes
          set ftp:ssl-allow no
          set ftp:passive-mode on
          set net:timeout 30
          set net:max-retries 3
          set net:reconnect-interval-base 5
          set mirror:parallel-transfer-count 3
          mirror -R --only-missing --parallel=3 --verbose -X .DS_Store images images
          mirror -R --only-missing --parallel=2 --verbose -X .DS_Store videos videos
          bye
          EOF
