name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload site to hosting
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: server173.hosting.reg.ru
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: ./
          timeout: 120000
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/scripts/**
            **/images/**
            **/videos/**
            portrait_background_reference.png
            **/*.mp4
            **/.DS_Store

      - name: Stage project photos and Live films
        run: |
          mkdir -p media-upload/images/works media-upload/videos
          cp -a images/works/cafe-1956 media-upload/images/works/cafe-1956
          cp -a images/works/landau media-upload/images/works/landau
          cp -a images/live media-upload/images/live
          cp -a videos/live media-upload/videos/live
          find media-upload -name '.DS_Store' -delete

      - name: Upload project photos and Live films
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: server173.hosting.reg.ru
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./media-upload/
          server-dir: ./
          timeout: 600000
          dangerous-clean-slate: false
          state-name: .ftp-deploy-sync-state-media.json
          exclude: |
            **/.DS_Store
